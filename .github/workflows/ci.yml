name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly on Mondays at 09:00 UTC so we catch upstream regressions
  # in terraform-docs, ruff, pytest, etc. even when nothing has been
  # pushed for a while.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  # Default to read-only. Individual jobs can opt-in to more.
  contents: read

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_DOCS_VERSION: "v0.20.0"

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (3.12 / 3.13 / 3.14)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install terraform-docs ${{ env.TERRAFORM_DOCS_VERSION }}
        run: |
          curl -fsSL \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/terraform-docs.tar.gz
          sudo tar -xzf /tmp/terraform-docs.tar.gz -C /usr/local/bin terraform-docs
          sudo chmod +x /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (60% coverage gate)
        run: pytest --cov=iac_cartographer --cov-report=term --cov-fail-under=60

  coverage-badge:
    name: coverage badge → `badges` branch
    runs-on: ubuntu-latest
    needs: test
    # Only refresh the published badge on main pushes. PRs run pytest with
    # coverage too (in the `test` job) but we don't want a PR to overwrite
    # main's badge before it merges.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # Required to push the generated SVG to the orphan `badges` branch.
      # Scoped to `contents: write` only — no PR, packages, or workflows.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install terraform-docs ${{ env.TERRAFORM_DOCS_VERSION }}
        run: |
          curl -fsSL \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/terraform-docs.tar.gz
          sudo tar -xzf /tmp/terraform-docs.tar.gz -C /usr/local/bin terraform-docs
          sudo chmod +x /usr/local/bin/terraform-docs

      - name: Install package + dev + genbadge
        run: |
          pip install -e ".[dev]"
          pip install 'genbadge[coverage]'

      - name: pytest with coverage.xml
        run: pytest --cov=iac_cartographer --cov-report=xml --cov-fail-under=60

      - name: Generate coverage.svg
        run: genbadge coverage -i coverage.xml -o coverage.svg

      - name: Publish badge to `badges` branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Stage the badge in a scratch dir so we can switch branches
          # without losing the file (orphan checkout wipes the worktree).
          mkdir -p /tmp/badge-staging
          cp coverage.svg /tmp/badge-staging/coverage.svg
          # `genbadge` left an untracked coverage.svg in the working tree.
          # When the `badges` branch is checked out below, git refuses
          # the checkout if a file with the same name exists on both
          # sides — so remove the working-tree copy now. We restage it
          # from /tmp after the checkout completes.
          rm -f coverage.svg

          # Check out (or create) the orphan `badges` branch. Orphan means
          # it shares no history with main, so its only commits are the
          # rolling badge updates — keeps main's log clean.
          if git ls-remote --exit-code --heads origin badges; then
            git fetch origin badges:badges
            git checkout badges
            git rm -rf . 2>/dev/null || true
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/badge-staging/coverage.svg coverage.svg

          # Skip the push if the badge is byte-identical to what's there —
          # avoids needless commits when coverage didn't budge.
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "Badge unchanged; skipping commit."
            exit 0
          fi
          git commit -m "ci: update coverage badge (${GITHUB_SHA::8})"
          git push origin badges

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    # Runs on every PR + push so chart syntax breakage is caught before merge.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: helm lint
        run: helm lint charts/iac-cartographer

      - name: helm template — defaults
        # Render with stock values. Fails CI on template errors that don't
        # surface from `helm lint` alone (it doesn't fully render).
        run: helm template iac-cartographer charts/iac-cartographer > /dev/null

      - name: helm template — existingSecret + existingConfigMap path
        # Override path: chart must NOT create its own Secret/ConfigMap.
        # This catches typos in the `if not .existingSecret` guards.
        run: |
          helm template iac-cartographer charts/iac-cartographer \
            --set secrets.existingSecret=external-secret \
            --set config.existingConfigMap=external-cm \
            > /tmp/rendered.yaml
          # The chart must not emit either resource when externals are set.
          if grep -E '^kind: (Secret|ConfigMap)$' /tmp/rendered.yaml; then
            echo "::error::chart emitted a Secret or ConfigMap despite existing* overrides"
            exit 1
          fi

      - name: kubeconform schema validation
        # Offline Kubernetes-API schema validation. `kubectl --dry-run=client`
        # was attempted here but it tries to fetch OpenAPI from a live API
        # server in 1.32+, which CI doesn't have. `kubeconform` ships the
        # schema with the binary and doesn't need a cluster — better fit.
        run: |
          KUBECONFORM_VERSION="v0.7.0"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform
          kubeconform -v
          helm template iac-cartographer charts/iac-cartographer \
            | kubeconform -strict -summary -schema-location default

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    # Only run on main pushes — building on every PR is wasteful and the
    # build is largely tested via the `test` job's dependency install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # `load: true` is what makes the image visible to the local
          # docker daemon. Without it, buildx keeps the layers in its
          # own cache only and the `docker run` smoke test below fails
          # with "Unable to find image 'iac-cartographer:ci' locally".
          # See https://github.com/docker/buildx#building-an-image
          push: false
          load: true
          tags: iac-cartographer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test --help
        run: docker run --rm iac-cartographer:ci --help
