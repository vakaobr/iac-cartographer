name: Deploy docs site

# Build the mkdocs-material site on every push to main and deploy it to
# GitHub Pages. PRs build the site too (without deploying) so the
# `strict: true` setting in mkdocs.yml catches broken links in review.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"   # docs deps live in [project.optional-dependencies].docs
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        # `mkdocs.yml` declares `strict: true`, so any broken internal
        # link / missing nav entry fails this step.
        run: pip install -e ".[docs]"

      - name: Build
        run: mkdocs build --strict

      - name: Upload site
        # Stash for the deploy job. Skipped on PRs (`deploy` doesn't run
        # there) but the build itself still acts as a strictness check.
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Tag pushes deploy too; main pushes are the primary trigger. PRs
    # only build, never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages artefact store
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
