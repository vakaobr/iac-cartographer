name: Release container image to GHCR

# Build the iac-cartographer container image and push it to the GitHub
# Container Registry on every tag push matching `v*`, plus a rolling
# `:main` tag on every main push so adopters can opt into a bleeding-edge
# image without needing a tag cut.
#
# Authentication: built-in `GITHUB_TOKEN` with `packages: write`. No PAT
# to manage, no secret to rotate.
#
# Image: `ghcr.io/vakaobr/iac-cartographer`
#
# Tags written:
#   * On tag push `vX.Y.Z`:  `:vX.Y.Z`, `:X.Y.Z`, `:X.Y`, `:X`, `:latest`
#   * On main push:           `:main`, `:main-<short-sha>`
#   * On manual dispatch:     `:dispatch-<short-sha>` (for ad-hoc smoke tests)
#
# Adopters pin to `:vX.Y.Z` in production manifests. `:latest` and `:main`
# are convenience tags — not recommended for unattended pipelines.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # `write` (not `read`) so the SBOM action can PATCH the GitHub Release
  # to attach the SPDX file. Without this the final SBOM-attach step
  # fails with "Resource not accessible by integration" even though the
  # image push + cosign signing succeed.
  contents: write
  packages: write
  # Required for cosign/sigstore keyless signing of the published image.
  id-token: write

concurrency:
  # Allow main pushes and tag pushes to run in parallel (different refs);
  # within one ref, queue rather than cancel — a tag-push must not be killed
  # by a follow-up commit on main.
  group: release-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build + push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        # Required to cross-build linux/arm64 on the linux/amd64 runner.
        # The qemu-user-static binaries are registered with binfmt_misc
        # so buildx can transparently emulate the foreign arch during
        # the RUN steps (apt-get + curl terraform-docs).
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semantic tags for tag pushes: vX.Y.Z, X.Y.Z, X.Y, X
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Rolling `:main` + `:main-<sha>` on main pushes
            type=ref,event=branch
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            # Manual dispatch — short-sha tag for traceability
            type=sha,prefix=dispatch-,enable=${{ github.event_name == 'workflow_dispatch' }}
            # `:latest` only on tag pushes — don't move it on every main push
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=iac-cartographer
            org.opencontainers.image.description=Fleet-level documentation for your Terraform / IaC estate.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Multi-arch build. buildx fan-outs the build over both
          # platforms and pushes a manifest list to GHCR — `docker pull`
          # on either arch resolves to the matching image automatically.
          # arm64 is emulated via the QEMU step above; build time is
          # roughly 2x amd64-alone but stays well under the per-job
          # GHA timeout for this image's size.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `provenance: false` keeps the manifest list shape simple
          # (no extra attestation manifest under the same tag) so
          # cosign + the SBOM action don't trip on `unknown` platform
          # entries that buildx adds when provenance is enabled.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        # Signs every tag we just published. The signature is recorded in
        # the Sigstore transparency log; adopters verify with:
        #   cosign verify ghcr.io/vakaobr/iac-cartographer:vX.Y.Z \
        #     --certificate-identity-regexp '^https://github\.com/vakaobr/iac-cartographer' \
        #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by digest so the signature binds to the exact bytes published.
          echo "$TAGS" | xargs -I{} cosign sign --yes "{}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        # Sticks an SBOM next to the image in the registry as an OCI artefact.
        # Adopters can pull it with `cosign download attestation` or
        # `docker buildx imagetools inspect`.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          # Use a deterministic artefact name so the SBOM upload below
          # doesn't collide across re-runs.
          artifact-name: iac-cartographer-sbom.spdx.json
          upload-release-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}
