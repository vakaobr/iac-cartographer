name: Security

# Two checks that need their own cadence + their own failure semantics,
# kept out of `ci.yml` so a transient pip-audit / gitleaks blip doesn't
# turn the main CI badge red.
#
#   * gitleaks  — secret scan over the working tree + full history.
#                  False positives are suppressed in `.gitleaksignore`.
#   * pip-audit — Python dependency CVE scan against the full extras
#                  resolution. New CVEs fail the build until they're
#                  fixed (Dependabot bump) or explicitly waived.
#
# Both run on every PR, every push to main, and weekly on Mondays at
# 09:00 UTC so we surface upstream advisories even without commits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history so gitleaks scans every commit, not just
          # the PR diff. ~2,000 commits at v0.1.0 — measured cost < 10s.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # The action prompts the user to set GITLEAKS_LICENSE for orgs;
          # personal accounts don't need it. Leave the var unset to keep
          # the OSS path active.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: pip-audit (Python CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install full dependency surface (incl. all optional extras)
        # Install every extras group so pip-audit sees the full transitive
        # closure a user could realistically pull. A CVE in `[gcp]` matters
        # even if the maintainer's day-to-day doesn't touch Vertex AI.
        #
        # NOTE: non-editable install on purpose. `pip-audit --strict` treats
        # editable installs as a warning-that-is-fatal, but we still want
        # `--strict` so yanked-version warnings turn red. Building+installing
        # the project for real also catches packaging regressions earlier.
        run: |
          pip install --upgrade pip
          pip install ".[dev,gcp,azure,openai,notion,email]"
          pip install pip-audit

      - name: Freeze deps (excluding the project itself)
        # pip-audit looks up EVERY installed distribution on PyPI. Since
        # the project under test is always ahead of the published PyPI
        # version (release-please PRs in particular bump pyproject.toml
        # to a tag that doesn't exist yet), we'd hit `Dependency not
        # found on PyPI` on every release PR. Filter our own package
        # out of the audit list.
        #
        # `pip freeze --exclude PKG` (pip >= 22) matches by canonical
        # PEP 503 name, so it filters every line shape pip can emit:
        #   * `iac-cartographer==<ver>`              — published wheel
        #   * `iac-cartographer @ file:///...`       — non-editable install
        #     from the local source dir (what CI does via `pip install .`)
        #   * `-e file:///...#egg=iac_cartographer`  — editable install
        # The previous `grep -v '^iac[-_]cartographer=='` only matched
        # the `==` form, so the `@ file://...` form leaked through and
        # broke release-please PRs (see #108).
        run: |
          pip freeze --exclude-editable --exclude iac-cartographer > /tmp/audit-deps.txt
          echo "::group::Frozen dep tree ($(wc -l < /tmp/audit-deps.txt) packages)"
          cat /tmp/audit-deps.txt
          echo "::endgroup::"
          # Belt-and-braces: if a future pip release ever changes the
          # canonical-name match semantics, fail loudly here instead of
          # silently passing a corrupt audit list to pip-audit downstream.
          if grep -i -E '^iac[-_]cartographer' /tmp/audit-deps.txt; then
            echo "::error::iac-cartographer leaked into the audit list — the --exclude filter didn't catch it"
            exit 1
          fi

      - name: Run pip-audit
        # `--strict` makes warnings (yanked versions, etc.) hard-fail.
        # `--ignore-vuln` waivers go in `.pip-audit.toml` — keep them
        # rare and timestamped.
        run: pip-audit --strict -r /tmp/audit-deps.txt
