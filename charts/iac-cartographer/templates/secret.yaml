{{- /*
Secret holding the IAC_CARTOGRAPHER_SECRET_* / IAC_CARTOGRAPHER_PARAM_*
env vars. Only created when the operator hasn't pointed
`secrets.existingSecret` at an externally-managed Secret (e.g. one
created by External Secrets Operator, Sealed Secrets, SOPS).

For production deployments, `existingSecret` is strongly preferred — it
keeps real credentials out of Helm values and out of the release manifest.
*/ -}}
{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iac-cartographer.secretName" . }}
  labels:
    {{- include "iac-cartographer.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
