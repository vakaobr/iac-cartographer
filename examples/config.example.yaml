# iac-cartographer — example configuration.
#
# In production, store this in AWS SSM Parameter Store at the path matching
# `DEFAULT_CONFIG_SOURCE` in cli.py (default: `/iac-cartographer/config`).
# For local development, point `--config` at this file directly:
#
#   iac-cartographer --once --dry-run --no-llm --config examples/config.example.yaml
#
# Every field has a safe default in `iac_cartographer/models.py`; this file
# documents the real-world override pattern. Strict mode rejects unknown keys.

discovery:
  # GitLab group IDs whose subtrees (incl. subgroups) should be scanned for
  # `*.tf` files. Numeric IDs only — find them on the group's GitLab page.
  # Empty list = skip GitLab.
  gitlab_group_ids:
    - 15

  # Self-hosted GitLab instances: point at the base host (without /api/v4).
  # Omit / set to https://gitlab.com for the hosted version.
  gitlab_base_url: "https://gitlab.example.com"

  # GitHub organisations to scan via the GitHub code-search API.
  # Empty list = skip GitHub.
  github_orgs:
    - "acme-org"
  # GitHub REST API base. Defaults to https://api.github.com (public GitHub
  # + GitHub Enterprise Cloud). For self-hosted GitHub Enterprise Server,
  # point at your instance — and include the /api/v3 suffix (not auto-added):
  #   github_base_url: "https://ghe.example.com/api/v3"

  # Bitbucket Cloud workspaces to enumerate. Empty list = skip Bitbucket.
  # Unlike GitLab/GitHub, the Bitbucket Cloud public API has no
  # `extension:tf`-style code search on free plans — this source lists
  # every repo in the workspace and lets the per-repo extractor filter
  # out the ones with no .tf files. For large mixed-workload workspaces,
  # narrow the scope with `deny_repos` patterns below, or use
  # `repos_file` instead for a hand-curated list.
  # Credentials come from the `iac-cartographer/bitbucket` secret —
  # set EITHER `access_token` (recommended; workspace access token)
  # OR `username` + `app_password` in that secret's JSON payload.
  bitbucket_workspaces:
    - "acme"

  # Gitea / Forgejo organisations to enumerate. Empty list = skip.
  # One source covers both platforms (Forgejo forked from Gitea and
  # preserves API compatibility). Like Bitbucket, lists every repo
  # in each org and lets the per-repo extractor filter — Gitea's
  # code-search API is per-repo only, and many self-hosted instances
  # disable the indexer. Combine with deny_repos to narrow large orgs.
  # Credentials come from the `iac-cartographer/gitea` secret as
  # `{"token": "..."}`. The same token powers discovery + clone.
  gitea_orgs:
    - "acme"

  # Gitea / Forgejo base URL. REQUIRED when gitea_orgs is non-empty —
  # Gitea has no hosted-default URL; every deployment is self-hosted.
  gitea_base_url: "https://gitea.example.com"

  # Optional path to a YAML/JSON file containing pre-curated repo
  # metadata. Use for air-gapped runs or self-hosted VCS that
  # iac-cartographer doesn't natively support yet (Codeberg uses the
  # Gitea API so `gitea_orgs` above also works; others go via file).
  # Path is interpreted relative to the CWD of the running container.
  # repos_file: "./repos.yaml"

  # Glob patterns (against `full_name`) to exclude from publishing.
  deny_repos:
    - "acme-org/*-archived"
    - "acme-org/examples-*"

  # Optional override map: full_name → owning-team string.
  # Useful when team ownership isn't derivable from the repo path.
  owner_overrides:
    "acme-org/platform-shared": "Platform"

llm:
  # Which LLM provider to use.
  #   "bedrock"   → AWS Bedrock InvokeModel (auth via the AWS credential
  #                 chain — env vars, instance profile, IRSA). Default.
  #   "anthropic" → Anthropic API direct (auth via the API key in the
  #                 iac-cartographer/anthropic secret). Use when you don't
  #                 have Bedrock access or want lower latency from the EU.
  #   "vertex"    → Claude on Vertex AI / Google Cloud (auth via GCP
  #                 Application Default Credentials — workload identity
  #                 in cluster, ADC for local dev, SA key for batch jobs).
  #                 Requires `pip install iac-cartographer[gcp]`.
  #   "azure_openai" → GPT family on Azure OpenAI (auth via API key in
  #                 the `iac-cartographer/azure_openai` secret, OR
  #                 Azure AD / managed identity when use_aad is true).
  #                 First non-Claude backend — GPT-4 emits invalid
  #                 JSON slightly more often than Claude; the backend
  #                 retries once. Requires `pip install iac-cartographer[azure]`.
  #   "openai"    → GPT family via api.openai.com or any OpenAI-compatible
  #                 gateway (LiteLLM, internal gateway, self-hosted vLLM).
  #                 Auth via the `iac-cartographer/openai` secret.
  #                 Requires `pip install iac-cartographer[openai]`.
  #   "ollama"    → Local LLM via Ollama's native /api/chat endpoint.
  #                 No auth, no API keys, no outbound traffic — model
  #                 pulled once and served from `ollama_base_url`. Good
  #                 fit for air-gapped runs, dev laptops, and homelab.
  #                 Uses raw httpx — no optional dependency group.
  backend: "bedrock"

  # Model identifier. Backend-specific:
  #   bedrock:   inference-profile ID (e.g.
  #              "eu.anthropic.claude-sonnet-4-5-20250929-v1:0").
  #   anthropic: model name (e.g. "claude-sonnet-4-5-20250929").
  #   vertex:    publisher-prefixed Claude model on Vertex AI (e.g.
  #              "claude-sonnet-4-5@20240620"). See
  #              https://cloud.google.com/vertex-ai/generative-ai/docs/partner-models/use-claude
  # Override to Haiku for cheap validation runs.
  model_id: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
  max_tokens: 4096

  # Bump this string when you change the system prompt — forces a republish
  # of every child page on the next run (otherwise banner-SHA short-circuits).
  system_prompt_version: "v1"

  # Bedrock-only: AWS region for the boto3 client. Ignored for other backends.
  bedrock_region: "eu-central-1"

  # Anthropic-only: API base URL. Override to point at an internal proxy /
  # gateway. Ignored for other backends.
  anthropic_base_url: "https://api.anthropic.com"

  # Vertex-only: GCP project hosting the Vertex AI Claude endpoint.
  # Required when backend=vertex (cli refuses to start otherwise).
  # vertex_project_id: "my-gcp-project"

  # Vertex-only: Vertex AI region. Pick one where Claude is available
  # (us-east5, europe-west1, asia-southeast1, …).
  vertex_region: "europe-west1"

  # Azure OpenAI-only: resource endpoint URL.
  # Required when backend=azure_openai.
  # azure_openai_endpoint: "https://my-resource.openai.azure.com/"

  # Azure OpenAI-only: deployment NAME from Azure OpenAI Studio.
  # Required when backend=azure_openai. `model_id` is ignored for this
  # backend (Azure routes by deployment name, not model name).
  # azure_openai_deployment: "my-gpt4-deployment"

  # Azure OpenAI-only: API version. Bump as Azure releases new versions.
  azure_openai_api_version: "2024-10-21"

  # Azure OpenAI-only: skip the `iac-cartographer/azure_openai` secret
  # and authenticate via Azure AD / managed identity instead. Workload
  # identity in cluster, IMDS on Azure VMs, or `az login` ADC for
  # local dev. The AAD-bound identity needs `Cognitive Services OpenAI
  # User` on the resource.
  azure_openai_use_aad: false

  # OpenAI-only: API base URL. Override to point at an OpenAI-compatible
  # gateway / proxy (LiteLLM, internal gateway, self-hosted vLLM).
  openai_base_url: "https://api.openai.com/v1"

  # OpenAI-only: org ID for accounts with multi-org billing. Leave
  # null/unset for most accounts.
  # openai_organization: "org-..."

  # Ollama-only: base URL of the Ollama server. Default points at the
  # local install; override for remote hosts (e.g. a homelab GPU box).
  ollama_base_url: "http://localhost:11434"

  # Ollama-only: HTTP timeout in seconds. Local inference is slower
  # than hosted APIs, especially on CPU / cold starts — 300s is the
  # default. Tune to taste.
  ollama_timeout_seconds: 300

  # Ollama-only: extra headers attached to every request. Only needed
  # when you've fronted Ollama with a reverse proxy that adds bearer
  # token / mTLS auth (Ollama itself has no auth). Default: empty.
  # ollama_extra_headers:
  #   Authorization: "Bearer my-proxy-token"

publisher:
  # Which backend renders + writes the inventory.
  #   "confluence" → Atlassian Confluence Cloud, ADF body, banner-SHA
  #                  idempotency. Requires the `confluence:` block below
  #                  AND credentials in the `iac-cartographer/confluence`
  #                  secret. Default.
  #   "markdown"   → Plain Markdown files under `markdown.output_dir`,
  #                  banner-SHA encoded as an HTML comment. Use for docs
  #                  repos (mkdocs/Hugo/Docusaurus/Jekyll), CI artefacts,
  #                  or air-gapped environments.
  #   "html"       → Self-contained HTML files under `html.output_dir`.
  #                  Embedded CSS, no JS, no external dependencies. Use
  #                  for stakeholder snapshots (email the index.html),
  #                  S3 / GitHub Pages hosting, or audit-PDF print.
  #   "json"       → Machine-readable JSON files under `json_output.output_dir`.
  #                  Designed as a feed for Backstage catalog imports,
  #                  internal CMDBs, dashboards, and custom tooling that
  #                  consumes the inventory programmatically.
  #   "notion"     → Notion sub-pages under `notion.parent_page_id`.
  #                  Each repo = one sub-page, plus an "Overview" page
  #                  with cross-links. SHA-callout idempotency.
  #                  Credentials: `iac-cartographer/notion` secret as
  #                  `{"integration_token": "secret_..."}`.
  #                  Requires `pip install iac-cartographer[notion]`.
  #   "github_wiki"→ Markdown files git-pushed to a repo's GitHub Wiki.
  #                  Layout matches the local-markdown publisher; reuses
  #                  the existing `iac-cartographer/github` secret (no
  #                  extra credential to manage). The wiki must already
  #                  exist (visit /wiki and create one page first).
  kind: "confluence"

secrets:
  # Where credentials (Confluence, GitLab, GitHub, Slack, Anthropic,
  # Bitbucket) and opaque parameters (the Confluence parent page ID)
  # come from.
  #   "aws"   → AWS Secrets Manager for secrets, SSM Parameter Store for
  #             parameters. Default — what the production deployment
  #             iac-cartographer was extracted from uses.
  #   "env"   → Process env vars. Naming convention:
  #               IAC_CARTOGRAPHER_SECRET_<NAME>    (JSON value)
  #               IAC_CARTOGRAPHER_PARAM_<NAME>     (plain string)
  #             Optional .env autoload via `env_dotenv_path`.
  #   "vault" → HashiCorp Vault KV v2 over HTTP. Auth via VAULT_TOKEN
  #             env var (set externally — k8s injector, AppRole, etc.).
  backend: "aws"

  # AWS backend only — boto3 region for Secrets Manager + SSM clients.
  aws_region: "eu-central-1"

  # env backend only — autoload `KEY=value` pairs from this file before
  # reading env vars. Pre-existing env vars take precedence.
  # env_dotenv_path: "/etc/iac-cartographer/.env"

  # vault backend only — server URL + KV v2 layout.
  # vault_addr: "https://vault.example.com"
  # vault_mount: "secret"                       # KV v2 mount
  # vault_path_prefix: "iac-cartographer/"      # logical prefix under mount
  # vault_namespace: null                       # Vault Enterprise only

confluence:
  # Atlassian Cloud site (no protocol, no trailing slash).
  site: "acme.atlassian.net"
  # Space key — the parent page must already exist in this space.
  space_key: "DOCS"
  # Reference to the parameter holding the parent page's numeric ID as a
  # string — resolved via the active secrets backend (AWS SSM path / env
  # var / Vault path). iac-cartographer reads this at startup (preflight
  # check), so a missing / incorrect ID surfaces as a clean error on the
  # first run. (Pre-1.0 key name `parent_page_id_ssm_path` still works but
  # is deprecated.)
  parent_page_id_ref: "/iac-cartographer/confluence-parent-id"
  # Optional direct override — when set, the page ID is taken verbatim
  # from here and `parent_page_id_ref` is ignored. Use for small teams /
  # file-based config where a parameter-store round-trip is overkill (the
  # parent page ID isn't a secret — it's a stable integer).
  # parent_page_id: "123456789"

markdown:
  # Only used when `publisher.kind == "markdown"`. Layout produced:
  #
  #   <output_dir>/index.md            ← overview / index page
  #   <output_dir>/repos/<slug>.md     ← one file per discovered repo
  #
  # `<slug>` is the repo's full_name with `/` replaced by `__`, so links
  # stay flat and static-site routing doesn't get weird. Each file's first
  # line is `<!-- iac-cartographer-sha: <sha> -->`; on the next run we
  # compare against the new SHA and skip the write when unchanged.
  output_dir: "./iac-inventory"

html:
  # Only used when `publisher.kind == "html"`. Same layout as markdown
  # (index.html + repos/<slug>.html). Each file is fully self-contained:
  # CSS is embedded in a <style> block, no external fonts or JavaScript.
  # The output works opened directly from disk, zipped + emailed, or
  # uploaded to S3 / GitHub Pages. Banner-SHA idempotency lives in a
  # `<meta name="iac-cartographer-sha">` tag in each file's head.
  output_dir: "./iac-inventory-html"

json_output:   # pre-1.0 key `json:` still works but is deprecated
  # Only used when `publisher.kind == "json"`. Same layout as the
  # markdown / html publishers (index.json + repos/<slug>.json) but the
  # output is structured JSON for machine consumption:
  #   * `index.json` carries one row per repo with summary fields plus
  #     `aggregates.{repo_count,total_resources,top_providers}` — a
  #     ready-to-import feed for Backstage catalog imports, dashboards,
  #     or internal CMDB ingestion.
  #   * Per-repo files carry the full RepoInventory (providers, modules,
  #     resources, inputs, outputs, narrative).
  # Top-level `iac_cartographer.sha` field carries the banner SHA for
  # the idempotent-republish short-circuit.
  output_dir: "./iac-inventory-json"

notion:
  # Only used when `publisher.kind == "notion"`. UUID of the parent
  # Notion page; the operator pre-creates it and shares it with the
  # integration via the page's Connections menu. Each repo becomes a
  # sub-page; an "Overview" sub-page carries the aggregate summary
  # with cross-links. SHA-callout idempotency at the top of every
  # page (🔖 iac-cartographer SHA: <hex>).
  parent_page_id: "11111111-1111-1111-1111-111111111111"

github_wiki:
  # Only used when `publisher.kind == "github_wiki"`. Target repo for
  # the wiki; the publisher writes Markdown files to
  # `<owner>/<repo>.wiki.git`. The wiki must already be enabled +
  # initialised with at least one page. Reuses the existing
  # `iac-cartographer/github` secret (same token as GitHub discovery).
  owner: "acme-org"
  repo: "infrastructure"
  # Author identity baked into each commit. Override for service-account
  # deployments (e.g. `github-actions[bot]@users.noreply.github.com`).
  commit_author_name: "iac-cartographer"
  commit_author_email: "iac-cartographer@noreply"

slack:
  # Legacy single-channel notification config. When `notifications:`
  # (below) is unset / empty, this block + the `iac-cartographer/slack`
  # secret act as the sole destination at all three severities.
  # Existing deployments need no changes — leave `notifications:` empty
  # and this keeps working.
  #
  # #channel-name or a Slack channel ID (C0...). The bot token from
  # `iac-cartographer/slack` secret must be invited to this channel.
  channel: "#alerts"

# Multi-channel notifications. When non-empty, the dispatcher fans every
# pipeline event out to each listed channel concurrently and honours
# each entry's `levels:` filter. When non-empty, the legacy `slack:`
# block above is IGNORED — you've opted into explicit routing. Leave
# this list empty (default) to keep the single-Slack back-compat path.
#
# Channel kinds shipped today:
#   "slack"         → Slack bot-token `chat.postMessage`. Same credentials
#                     as the legacy block (`iac-cartographer/slack` secret).
#   "webhook"       → Generic JSON POST to any URL with our own stable
#                     schema (`{schema, level, message, ts, source}`).
#                     Catch-all destination — internal observability
#                     platforms, custom Lambda forwarders, etc.
#                     Credentials: `iac-cartographer/webhook` secret as
#                     `{"url": "https://..."}`.
#   "slack_webhook" → Slack-compatible incoming webhook. Drop-in for
#                     native Slack incoming webhooks, RocketChat, and
#                     Mattermost (all accept Slack-shaped `{"text"}`
#                     payloads). Credentials: `iac-cartographer/slack_webhook`
#                     secret as `{"url": "https://..."}`.
#   "teams"         → Microsoft Teams workflow webhook + Adaptive Card.
#                     Severity → colour mapping (good / warning / attention).
#                     Works with Workflow webhooks (Power Automate) and
#                     legacy Office 365 Connector webhooks.
#                     Credentials: `iac-cartographer/teams` secret as
#                     `{"url": "https://..."}`.
#   "email"         → SMTP via aiosmtplib. Multipart/alternative with an
#                     HTML severity-coloured header + plain-text fallback.
#                     Requires `pip install iac-cartographer[email]`.
#                     Credentials: `iac-cartographer/email` secret as
#                     `{"username": "...", "password": "..."}`.
#   "sns"           → AWS SNS topic publish. Identity-based (no stored
#                     secret) — auth via the AWS credential chain.
#                     IAM principal needs `sns:Publish` on the topic.
#                     `level` MessageAttribute lets downstream SNS
#                     filter policies route per-severity.
#   "pagerduty"     → PagerDuty Events API v2 incident trigger.
#                     Strongly recommend pairing with `levels: [error]`.
#                     Credentials: `iac-cartographer/pagerduty` secret
#                     as `{"routing_key": "..."}` (per-Service key).
#   "opsgenie"      → Opsgenie Alerts API. `GenieKey` auth.
#                     Set `region: "eu"` for EU-resident accounts
#                     (US default; planes are NOT linked).
#                     Credentials: `iac-cartographer/opsgenie` secret
#                     as `{"api_key": "..."}`.
#   "discord"       → Discord Incoming Webhook. Per-channel.
#                     Optional `username` / `avatar_url` per-message
#                     overrides for multi-deployment identity.
#                     Credentials: `iac-cartographer/discord` secret
#                     as `{"url": "https://discord.com/api/webhooks/..."}`.
#   "stdout"        → JSON Lines to stdout / stderr. No credentials,
#                     no HTTP, no SDK. Useful for CI, air-gapped, or
#                     local dev. Set `stream: "stderr"` to keep
#                     stdout free for machine-parseable output.
# See docs/backends/notifications.md for the full reference.
notifications: []
  # Example — chat (info) + Teams (error) + email + SNS for downstream fanout:
  # - kind: slack
  #   channel: "#infra-info"
  #   # levels defaults to all three when omitted
  # - kind: teams
  #   levels: [error]
  # - kind: email
  #   smtp_host: "smtp.sendgrid.net"
  #   from_address: "iac-cartographer@example.com"
  #   to_addresses:
  #     - "oncall@example.com"
  #   levels: [error]
  # - kind: sns
  #   topic_arn: "arn:aws:sns:eu-central-1:123456789012:iac-cartographer"
  #   region: "eu-central-1"
  # - kind: webhook
  #   extra_headers:
  #     Authorization: "Bearer my-internal-token"
  # - kind: slack_webhook       # Slack incoming / RocketChat / Mattermost
  #   levels: [warn, error]
  # - kind: pagerduty            # page on-call when iac-cartographer errors
  #   levels: [error]
  # - kind: opsgenie             # Opsgenie alternative — pick one
  #   region: "us"               # or "eu"
  #   levels: [error]
  # - kind: discord              # community / homelab chat
  #   username: "iac-cartographer (prod)"
  # - kind: stdout               # JSONL → CI log capture
  #   stream: "stdout"           # or "stderr"
