# iac-cartographer — example configuration.
#
# In production, store this in AWS SSM Parameter Store at the path matching
# `DEFAULT_CONFIG_SOURCE` in cli.py (default: `/iac-cartographer/config`).
# For local development, point `--config` at this file directly:
#
#   iac-cartographer --once --dry-run --no-bedrock --config examples/config.example.yaml
#
# Every field has a safe default in `iac_cartographer/models.py`; this file
# documents the real-world override pattern. Strict mode rejects unknown keys.

discovery:
  # GitLab group IDs whose subtrees (incl. subgroups) should be scanned for
  # `*.tf` files. Numeric IDs only — find them on the group's GitLab page.
  # Empty list = skip GitLab.
  gitlab_group_ids:
    - 15

  # Self-hosted GitLab instances: point at the base host (without /api/v4).
  # Omit / set to https://gitlab.com for the hosted version.
  gitlab_base_url: "https://gitlab.example.com"

  # GitHub organisations to scan via the GitHub code-search API.
  # Empty list = skip GitHub.
  github_orgs:
    - "acme-org"

  # Bitbucket Cloud workspaces to enumerate. Empty list = skip Bitbucket.
  # Unlike GitLab/GitHub, the Bitbucket Cloud public API has no
  # `extension:tf`-style code search on free plans — this source lists
  # every repo in the workspace and lets the per-repo extractor filter
  # out the ones with no .tf files. For large mixed-workload workspaces,
  # narrow the scope with `deny_repos` patterns below, or use
  # `repos_file` instead for a hand-curated list.
  # Credentials come from the `iac-cartographer/bitbucket` secret —
  # set EITHER `access_token` (recommended; workspace access token)
  # OR `username` + `app_password` in that secret's JSON payload.
  bitbucket_workspaces:
    - "acme"

  # Optional path to a YAML/JSON file containing pre-curated repo
  # metadata. Use for air-gapped runs, self-hosted VCS without API
  # support (Gitea, Forgejo, Codeberg, …), or to pin a focused subset
  # of repos. See iac_cartographer/discovery/file.py for the schema.
  # Path is interpreted relative to the CWD of the running container.
  # repos_file: "./repos.yaml"

  # Glob patterns (against `full_name`) to exclude from publishing.
  deny_repos:
    - "acme-org/*-archived"
    - "acme-org/examples-*"

  # Optional override map: full_name → owning-team string.
  # Useful when team ownership isn't derivable from the repo path.
  owner_overrides:
    "acme-org/platform-shared": "Platform"

llm:
  # Which LLM provider to use.
  #   "bedrock"   → AWS Bedrock InvokeModel (auth via the AWS credential
  #                 chain — env vars, instance profile, IRSA). Default.
  #   "anthropic" → Anthropic API direct (auth via the API key in the
  #                 iac-cartographer/anthropic secret). Use when you don't
  #                 have Bedrock access or want lower latency from the EU.
  backend: "bedrock"

  # Model identifier. Backend-specific:
  #   bedrock:   inference-profile ID (e.g.
  #              "eu.anthropic.claude-sonnet-4-5-20250929-v1:0").
  #   anthropic: model name (e.g. "claude-sonnet-4-5-20250929").
  # Override to Haiku for cheap validation runs.
  model_id: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
  max_tokens: 4096

  # Bump this string when you change the system prompt — forces a republish
  # of every child page on the next run (otherwise banner-SHA short-circuits).
  system_prompt_version: "v1"

  # Bedrock-only: AWS region for the boto3 client. Ignored for backend=anthropic.
  bedrock_region: "eu-central-1"

  # Anthropic-only: API base URL. Override to point at an internal proxy /
  # gateway. Ignored for backend=bedrock.
  anthropic_base_url: "https://api.anthropic.com"

publisher:
  # Which backend renders + writes the inventory.
  #   "confluence" → Atlassian Confluence Cloud, ADF body, banner-SHA
  #                  idempotency. Requires the `confluence:` block below
  #                  AND credentials in the `iac-cartographer/confluence`
  #                  secret. Default.
  #   "markdown"   → Plain Markdown files under `markdown.output_dir`,
  #                  banner-SHA encoded as an HTML comment. Use for docs
  #                  repos (mkdocs/Hugo/Docusaurus/Jekyll), CI artefacts,
  #                  or air-gapped environments.
  kind: "confluence"

confluence:
  # Atlassian Cloud site (no protocol, no trailing slash).
  site: "acme.atlassian.net"
  # Space key — the parent page must already exist in this space.
  space_key: "DOCS"
  # SSM Parameter Store path holding the parent page's numeric ID as a string.
  # iac-cartographer reads this at startup (preflight check), so a missing /
  # incorrect ID surfaces as a clean error on the first run.
  parent_page_id_ssm_path: "/iac-cartographer/confluence-parent-id"

markdown:
  # Only used when `publisher.kind == "markdown"`. Layout produced:
  #
  #   <output_dir>/index.md            ← overview / index page
  #   <output_dir>/repos/<slug>.md     ← one file per discovered repo
  #
  # `<slug>` is the repo's full_name with `/` replaced by `__`, so links
  # stay flat and static-site routing doesn't get weird. Each file's first
  # line is `<!-- iac-cartographer-sha: <sha> -->`; on the next run we
  # compare against the new SHA and skip the write when unchanged.
  output_dir: "./iac-inventory"

slack:
  # #channel-name or a Slack channel ID (C0...). The bot token from
  # `iac-cartographer/slack` secret must be invited to this channel.
  channel: "#alerts"
