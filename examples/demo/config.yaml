# Demo config — clone + extract three public Terraform repos and emit
# the rendered output as Markdown under ./demo-output/.
#
# Designed to run with NO real credentials:
#   * `discovery.repos_file` source clones public repos via HTTPS — no auth.
#   * `secrets.backend: env` reads from env vars; the run.sh script sets
#     dummy placeholder values so the schema validation passes.
#   * `--no-llm` skips the LLM call entirely; placeholder narratives
#     are inserted so the rendered Markdown looks complete.
#   * `publisher.kind: markdown` writes locally; no Confluence access.
#   * Slack send at the end will fail with the dummy token; the failure
#     is logged but doesn't fail the run.
#
# Browse the output at `./demo-output/index.md` and `./demo-output/repos/`.

discovery:
  # Three curated public repos — see repos.yaml.
  repos_file: ./examples/demo/repos.yaml
  # No live VCS sources — the file source is sufficient for the demo.
  gitlab_group_ids: []
  github_orgs: []

secrets:
  backend: env

llm:
  # Bedrock backend doesn't load an extra secret env var (vs anthropic
  # which would require IAC_CARTOGRAPHER_SECRET_ANTHROPIC). Combined
  # with `--no-llm` on the CLI, the LLM is never actually invoked.
  backend: bedrock
  model_id: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  bedrock_region: eu-central-1

publisher:
  kind: markdown

markdown:
  output_dir: ./demo-output

slack:
  channel: "#demo-not-actually-posted"
