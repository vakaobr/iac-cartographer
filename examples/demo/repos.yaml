  clone_url: https://github.com/terraform-aws-modules/terraform-aws-vpc.git
  web_url: https://github.com/terraform-aws-modules/terraform-aws-vpc
  default_branch: master
  last_commit_sha: "0000000000000000000000000000000000000001"
