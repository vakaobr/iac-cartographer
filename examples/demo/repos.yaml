# Curated list of small, well-known public Terraform repositories that
# the demo run clones + analyses. Used as input to the file-based
# discovery source — see `discovery.repos_file` in demo-config.yaml.
#
# These are real upstream repos. The `last_commit_sha` and
# `last_commit_at` values here are static (it's a demo, not a live
# inventory) — they just need to be syntactically valid for the model
# validation. The actual page output uses the values from the cloned
# HEAD via the fetcher.

