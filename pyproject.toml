[project]
name = "iac-cartographer"
version = "0.1.6"
description = "Fleet-level documentation for your Terraform / IaC estate. Discovers repos (GitLab/GitHub/Bitbucket/Gitea/file), extracts structural facts via terraform-docs, narrates each repo with a pluggable LLM (Bedrock/Anthropic/Vertex/Azure OpenAI/OpenAI/Ollama), and publishes to Confluence, Notion, GitHub Wiki, Markdown, HTML, or JSON. Pluggable notifications (Slack, Teams, email, SNS, PagerDuty, Opsgenie, Discord, webhook, stdout)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anderson Leite", email = "falecom@andersonleite.me" },
]
keywords = [
    "terraform",
    "terraform-docs",
    "iac",
    "documentation",
    "confluence",
    "notion",
    "github-wiki",
    "bedrock",
    "llm",
    "claude",
    "gpt",
    "ollama",
    "slack",
    "teams",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml",
]

[project.urls]
# PyPI verifies URL labels whose host + path match the OIDC trusted-
# publisher repo (vakaobr/iac-cartographer). The labels below all do —
# they get a green "Verified" badge on the PyPI project page once the
# next publish lands. Custom-domain URLs (docs site) can't be verified
# the same way, so we use the GitHub-served docs source as the
# Documentation link for now.
Homepage = "https://github.com/vakaobr/iac-cartographer"
Documentation = "https://github.com/vakaobr/iac-cartographer/blob/main/docs/index.md"
Repository = "https://github.com/vakaobr/iac-cartographer"
Source = "https://github.com/vakaobr/iac-cartographer"
Issues = "https://github.com/vakaobr/iac-cartographer/issues"
Changelog = "https://github.com/vakaobr/iac-cartographer/blob/main/CHANGELOG.md"
Releases = "https://github.com/vakaobr/iac-cartographer/releases"

[project.optional-dependencies]
dev = [
    "moto>=5.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]
# `pip install iac-cartographer[gcp]` enables `llm.backend: vertex`
# (Claude on Vertex AI). The `anthropic` SDK is the official client and
# transitively pulls `google-auth` for ADC-based authentication.
gcp = [
    "anthropic[vertex]>=0.40",
]
# `pip install iac-cartographer[azure]` enables `llm.backend: azure_openai`
# (GPT family on Azure OpenAI). `openai` is the official SDK;
# `azure-identity` is required when `llm.azure_openai_use_aad: true` to
# authenticate via managed identity / workload identity.
azure = [
    "openai>=1.50",
    "azure-identity>=1.18",
]
# `pip install iac-cartographer[openai]` enables `llm.backend: openai`
# (GPT family via api.openai.com). Same SDK as the `[azure]` extra;
# installing either is enough if you only need one.
openai = [
    "openai>=1.50",
]
# `pip install iac-cartographer[email]` enables `notifications[].kind: email`
# (SMTP via aiosmtplib). Other notification channels (slack, webhook,
# slack_webhook, teams, sns) require no extra — they reuse the base
# httpx / boto3 pins.
email = [
    "aiosmtplib>=3.0",
]
# `pip install iac-cartographer[notion]` enables `publisher.kind: notion`.
# The official notion-client SDK handles auth, pagination, and the
# block-tree shape — much less code than rolling our own httpx wrapper.
notion = [
    "notion-client>=2.2",
]
# `pip install 'iac-cartographer[otel]'` enables the OpenTelemetry (OTLP)
# metrics exporter for non-AWS deployments. Activated at runtime by setting
# `IAC_CARTOGRAPHER_OTEL_EXPORTER_OTLP_ENDPOINT` (or the standard
# `OTEL_EXPORTER_OTLP_ENDPOINT`). Default OFF; the CloudWatch path is
# unaffected. SDK is imported lazily so the base install never pays for it.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# `pip install -e ".[docs]"` to build the mkdocs site locally:
#   mkdocs serve   # http://127.0.0.1:8000
#   mkdocs build --strict
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    # `mike` publishes versioned docs to the `gh-pages` branch. The
    # mkdocs-material theme picks it up via `extra.version.provider: mike`
    # and renders a version selector dropdown in the header.
    "mike>=2.1",
]

[project.scripts]
iac-cartographer = "iac_cartographer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iac_cartographer*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "S",    # bandit (security) — handles 4 secrets + invokes Bedrock
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PTH",  # pathlib
    "C4",   # comprehensions
    "DTZ",  # datetime timezone awareness
    "PIE",  # misc
    "RSE",  # raise linting
    "RET",  # return linting
    "FLY",  # f-string
    "PERF", # performance anti-patterns
    "LOG",  # logging best practices
    "T20",  # no print() in source
    "TCH",  # type-checking imports
    "ASYNC",# async-correctness (httpx + Bedrock orchestrated via asyncio)
]
ignore = [
    "S101",   # assert — allowed in tests
    "E501",   # line length — handled by formatter
    "RET504", # unnecessary assignment before return — readability choice
    "UP015",  # redundant open mode — explicit is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts allowed
    "S105",   # hardcoded password string in fixtures
    "S106",   # hardcoded password argument in fixtures
    "S108",   # hardcoded /tmp paths in fixtures (test config scaffolding, not real I/O)
    "T20",    # print() allowed in test scaffolding
    "PLR2004",# magic numbers OK in tests
    "TC002",  # pytest / typing imports used only in annotations — TYPE_CHECKING blocks add noise in tests
    "TC003",  # same for stdlib (Path) annotation-only imports in tests
]
"iac_cartographer/constants.py" = [
    "N818",   # exception class names without -Error suffix read better in tracebacks (e.g. `BedrockError: ...` vs `BedrockErrorError`)
]
"iac_cartographer/init_scaffold.py" = [
    "T201",   # the scaffolder's `print_next_steps` is the user-facing output; logging would route to JSON which is the wrong audience
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests requiring network or external services",
]

[tool.coverage.run]
source = ["iac_cartographer"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
